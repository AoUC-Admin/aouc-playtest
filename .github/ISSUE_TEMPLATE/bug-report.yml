name: Bug report
description: Report a reproducible game problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Reports are public. Do not post tester download links or personal saves/logs. Mark story spoilers."
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include location, choices and whether it repeats after reloading.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Windows version and GPU
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Review attachments for private information before posting.
